<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Final_logo.jpg">
    <title>Strike & Style | Modern Apparel</title>
    <meta name="description" content="Discover premium streetwear, minimalist clothing lines, and modern everyday essentials.">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourdomain.com/clothes.html">
    <meta property="og:title" content="BlueStream | Modern Streetwear & Apparel">
    <meta property="og:description" content="Upgrade your wardrobe with clean, minimalist aesthetics. Instant checkout via WhatsApp.">
    <meta property="og:image" content="https://yourdomain.com/images/og-clothes-banner.jpg">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="Final_logo.jpg" alt="BlueStream Logo">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="sports.html">Sports</a></li>
                <li><a href="#outerwear">Outerwear</a></li>
                <li><a href="#essentials">Essentials</a></li>
            </ul>
        </nav>
    </header>

    <main class="catalog-layout">
        <aside class="cart-sidebar" id="cart-component">
    <div class="cart-header-row">
        <h2>Your Shopping Cart</h2>
        <!-- Clear Cart Button Added -->
        <button id="clear-cart-btn" class="btn-clear-all" title="Clear entire cart">Clear All</button>
    </div>
    
    <div id="cart-items-container">
        <p class="empty-cart-msg">Your cart is empty.</p>
    </div>
    
    <div class="cart-summary">
        <p>Total: <strong>$<span id="cart-total-price">0.00</span></strong></p>
        <button id="whatsapp-checkout-btn" class="btn btn-whatsapp">Buy via WhatsApp</button>
    </div>
</aside>

        <section class="products-catalog">
            <h1>Modern Apparel Catalog</h1>

            <section id="outerwear" class="catalog-section">
                <h2>Premium Outerwear</h2>
                <div class="product-grid">
                    <article class="product-card">
                        <img src="Pastel Blue Heavyweight Hoodie.jpg" alt="Minimalist Pastel Blue Hoodie">
                        <h3>Pastel Blue Heavyweight Hoodie</h3>
                        <p class="price">$65.00</p>
                        <button class="btn btn-add-cart" data-name="Pastel Blue Heavyweight Hoodie" data-price="65.00">Add to Cart</button>
                    </article>
                </div>
            </section>

            <section id="essentials" class="catalog-section">
                <h2>Everyday Essentials</h2>
                <div class="product-grid">
                    <article class="product-card">
                        <img src="Classic Oversized Essential Tee.jpg" alt="Classic White Oversized Tee">
                        <h3>Classic Oversized Essential Tee</h3>
                        <p class="price">$28.00</p>
                        <button class="btn btn-add-cart" data-name="Classic Oversized Essential Tee" data-price="28.00">Add to Cart</button>
                    </article>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BlueStream E-Commerce. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
